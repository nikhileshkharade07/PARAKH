version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: parakh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parakh
      POSTGRES_USER: parakh
      POSTGRES_PASSWORD: parakh_secure_password
    ports:
      - "5432:5432"
    volumes:
      - parakh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parakh -d parakh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parakh-backend
    restart: unless-stopped
    environment:
      APP_NAME: PARAKH
      APP_ENV: production
      API_PREFIX: /api
      DATABASE_URL: postgresql+psycopg://parakh:parakh_secure_password@db:5432/parakh
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      JWT_SECRET: parakh-production-jwt-secret-key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: parakh-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  parakh_pgdata:
