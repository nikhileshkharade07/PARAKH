services:
  db:
    image: postgres:16-alpine
    container_name: parakh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parakh
      POSTGRES_USER: parakh
      POSTGRES_PASSWORD: parakh
    ports:
      - "5432:5432"
    volumes:
      - parakh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parakh -d parakh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parakh_pgdata:
