services:
  db:
    image: postgres:16-alpine
    container_name: parakh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parakh
      POSTGRES_USER: parakh
      POSTGRES_PASSWORD: parakh
    ports:
      - "5432:5432"
    volumes:
      - parakh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parakh -d parakh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: parakh-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://parakh:parakh@db:5432/parakh
      - JWT_SECRET_KEY=parakh_production_jwt_secret_2025_c4f8
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parakh-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  parakh_pgdata:
